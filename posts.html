<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Posts · BEBO Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <a href="./index.html">BEBO</a><span>/</span><strong>Posts</strong><span id="postsCrumbGroup" class="hidden">/</span><strong id="postsCrumbGroupName" class="hidden"></strong>
        </nav>
        <h1>Posts</h1>
        <p class="muted posts-intro">Posted history by date and group.</p>
      </div>
      <div class="top-actions">
        <details class="nav-menu">
          <summary aria-label="Open navigation" title="Menu">☰</summary>
          <nav>
            <a href="./index.html">Home</a>
            <a href="./posts.html">Posts</a>
            <a href="./report.html">Report</a>
            <a href="./analysis.html">Phân tích</a>
          </nav>
        </details>
      </div>
    </header>

    <main>
      <section class="page-toolbar posts-toolbar">
        <label class="toolbar-field posts-date-field">
          <span>Date</span>
          <input id="dateFilter" class="report-date-input posts-date-input" type="date" aria-label="Filter posts by date" />
        </label>
        <label class="toolbar-field">
          <span>Filter by group</span>
          <select id="groupFilter" class="toolbar-select">
            <option value="">All groups</option>
          </select>
        </label>
        <div id="postsCountLabel" class="report-count">—</div>
      </section>

      <section class="history-panel">
        <div class="table-wrap history-table-wrap">
          <table class="history-table">
            <thead>
              <tr>
                <th>Date / Time</th>
                <th>Prompt</th>
                <th>Group</th>
                <th>Like</th>
                <th>Comment</th>
              </tr>
            </thead>
            <tbody id="postRows"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state hidden">No posts found for this group.</div>
      </section>
    </main>
  </div>
  <script type="module" src="./posts.js"></script>
</body>
</html>
