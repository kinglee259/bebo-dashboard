<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Report · BEBO Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <nav class="breadcrumb" aria-label="Breadcrumb"><a href="./index.html">BEBO</a><span>/</span><strong>Report</strong></nav>
        <h1>Report</h1>
      </div>
      <div class="top-actions">
        <details class="nav-menu">
          <summary aria-label="Open navigation" title="Menu">☰</summary>
          <nav>
            <a href="./index.html">Home</a>
            <a href="./posts.html">Posts</a>
            <a href="./report.html">Report</a>
          </nav>
        </details>
      </div>
    </header>

    <main>
      <section class="report-toolbar">
        <div class="report-toolbar-left">
          <div>
            <div id="reportDateLabel" class="date-label"></div>
            <div class="tabs" role="tablist">
              <button class="tab active" data-day="today">Today</button>
              <button class="tab" data-day="yesterday">Yesterday</button>
              <button class="tab" data-day="custom">Custom</button>
            </div>
          </div>
        </div>

        <div class="report-toolbar-right">
          <label id="customDateField" class="toolbar-field report-toolbar-field report-date-field hidden">
            <span>Date</span>
            <input id="customDate" class="report-date-input" type="date" aria-label="Report date" />
          </label>
          <label class="toolbar-field report-toolbar-field">
            <span>Sort by</span>
            <select id="sortBy" class="toolbar-select">
              <option value="group_az">Group A–Z</option>
              <option value="group_za">Group Z–A</option>
              <option value="time_asc">Time ↑</option>
              <option value="time_desc">Time ↓</option>
              <option value="comments_desc">Comments high → low</option>
              <option value="likes_desc">Likes high → low</option>
            </select>
          </label>
          <label class="toolbar-field report-toolbar-field">
            <span>Group by</span>
            <select id="groupBy" class="toolbar-select">
              <option value="group" selected>Group</option>
              <option value="none">None</option>
            </select>
          </label>
          <div id="reportCount" class="report-count">—</div>
        </div>
      </section>

      <section class="report-panel">
        <div class="table-wrap report-table-wrap">
          <table class="report-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Prompt</th>
                <th>Quote</th>
                <th>Group</th>
                <th>Like</th>
                <th>Comment</th>
                <th>Share</th>
                <th>✓</th>
              </tr>
            </thead>
            <tbody id="reportRows"></tbody>
          </table>
        </div>
        <div id="reportEmpty" class="empty-state hidden">No posts found for this day.</div>
      </section>
    </main>
  </div>

  <script type="module" src="./report.js"></script>
</body>
</html>
