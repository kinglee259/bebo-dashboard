<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeBo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥑%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <nav class="breadcrumb brand-home" aria-label="Brand"><a href="./index.html">🥑 BeBo 🥑</a></nav>
      </div>
      <div class="top-actions">
        <details class="nav-menu">
          <summary aria-label="Open navigation" title="Menu">☰</summary>
          <nav>
            <a href="./index.html">Home</a>
            <a href="./posts.html">Posts</a>
            <a href="./report.html">Report</a>
            <a href="./analysis.html">Phân tích</a>
          </nav>
        </details>
      </div>
    </header>

    <main>
      <section class="hero-row home-kpi-toolbar">
        <div class="tabs" role="tablist">
          <button class="tab active" data-day="today">Today</button>
          <button class="tab" data-day="yesterday">Yesterday</button>
          <button class="tab" data-day="y-1">Y-1</button>
        </div>
        <div class="home-kpi-meta">
          <div id="dateLabel" class="date-label"></div>
          <div class="kpi-copy">Daily KPI: <strong id="kpiRange">3 posts / group</strong></div>
        </div>
      </section>

      <section class="cards-grid">
        <article class="card clickable-card" id="postsCard" title="View posts for this day">
          <span>Posts</span><strong id="postsCount">—</strong><small id="postsGoal">—</small>
        </article>
        <article class="card"><span>Groups posted</span><strong id="groupsPosted">—</strong><small id="groupsRemaining">—</small></article>
        <article class="card"><span>Groups at minimum KPI</span><strong id="groupsAtKpi">—</strong><small id="groupsAtKpiPct">—</small></article>
        <article class="card"><span>Posts still needed</span><strong id="postsNeeded">—</strong><small id="postsNeededHint">to reach minimum KPI</small></article>
      </section>

      <section class="progress-panel">
        <div class="progress-head"><span>Minimum daily posting KPI</span><strong id="progressText">—</strong></div>
        <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
      </section>

      <section class="list-panel" id="groupsPanel">
        <div class="list-head list-head-legend">
          <div class="legend"><span class="dot auto"></span> Auto <span class="dot manual"></span> Manual <span class="dot unknown"></span> Unknown</div>
        </div>
        <div class="tier-block tier-block-priority">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Group</th><th>Approval</th><th>Posts</th><th>Status</th><th></th></tr></thead>
              <tbody id="priorityRows"></tbody>
            </table>
          </div>
        </div>

        <div class="tier-block tier-block-signal">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Group</th><th>Approval</th><th>Posts</th><th>Status</th><th></th></tr></thead>
              <tbody id="signalRows"></tbody>
            </table>
          </div>
        </div>

        <div class="tier-block tier-block-follow">
          <div class="table-wrap">
            <table>
              <thead><tr><th>Group</th><th>Approval</th><th>Posts</th><th>Status</th><th></th></tr></thead>
              <tbody id="followRows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
